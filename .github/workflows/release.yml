name: release

on:
  push:
    branches: [master]

permissions:
  contents: write       # create tags + releases
  issues: write         # semantic-release comments
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # semantic-release needs full history + tags
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The cross-compile runs inside semantic-release's prepare step (see the
      # exec plugin in .releaserc.json), for two reasons: the binaries can be
      # stamped with the tag about to be published, and nothing is built at all
      # on a master push with no releasable commits.
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes -p semantic-release@24 -p @semantic-release/exec@7 semantic-release
